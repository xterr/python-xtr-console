[project]
name = "xtr-console"
version = "0.1.0"
description = "Async-native console applications for Python: commands as functions or classes, declared once and wired by a container."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Razvan Ceana", email = "razvan@ceana.ro" }
]
keywords = ["cli", "console", "command", "async", "cyclopts", "wireup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=5.0,<6",
    "rich>=13.6",
    "typing-extensions>=4.4",
]

[project.optional-dependencies]
wireup = [
    "wireup>=2.12",
]
trio = [
    "cyclopts[trio]>=5.0,<6",
]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "ruff>=0.8",
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4.0",
    "ty>=0.0.83",
    "wireup>=2.12",
    "xtr-logging>=0.2",
]

# xtr-logging is not on PyPI yet; resolve it from its repository meanwhile.
[tool.uv.sources]
xtr-logging = { git = "https://github.com/xterr/python-xtr-logging.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtr_console"]

# ─────────────────────────────────────────────────────────────────
# basedpyright — typeCheckingMode = "all" sets every report flag to error
# ─────────────────────────────────────────────────────────────────
[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist", ".tmp"]

reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

# "Any signature" has one spelling a type checker accepts: *args: Any,
# **kwargs: Any. The protocol holding a command class to returning an int
# needs it; scoped here only.
[[tool.basedpyright.executionEnvironments]]
root = "src/xtr_console/command/command_callable.py"
reportAny = "none"
reportExplicitAny = "none"

# ─────────────────────────────────────────────────────────────────
# ruff — select = ["ALL"], minimal justified ignores
# ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatter conflicts (ruff documents these)
    "COM812",
    "ISC001",
    # Mutually-exclusive docstring conventions; keep the modern one
    "D203",
    "D213",
    # Project-specific noise
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
    # Exceptions compose their own messages from typed fields.
    "TRY003",
    "EM101",
    "EM102",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# wireup registers a command class under its constructor annotations, read at
# runtime. Deferring them would register the class with nothing to resolve.
"src/xtr_console/integration/wireup.py" = ["TC001", "TC002", "TC003"]
# *args: Any, **kwargs: Any is how a protocol says "any signature"; see the
# basedpyright execution environment for the same file.
"src/xtr_console/command/command_callable.py" = ["ANN401"]
"tests/unit/integration/test_wireup.py" = ["TC001", "TC002", "TC003"]
"tests/**/*.py" = [
    "S101",    # assert is the point of pytest
    "S603",    # a fresh interpreter is the only way to assert a module was never imported
    "ARG",     # fixtures look unused
    "PLR2004", # magic numbers in test data
    "SLF001",  # tests reach into privates
    "D",       # test names are the docs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ─────────────────────────────────────────────────────────────────
# ty — a second opinion on the source
# ─────────────────────────────────────────────────────────────────
[tool.ty.src]
include = ["src", "tests"]

# ─────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
